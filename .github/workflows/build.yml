name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller urllib3 certifi charset-normalizer setuptools requests websocket-client

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile surveyscramblebot.py

    - name: Rename EXE to include Version
      shell: bash
      run: |
        # If triggered by a tag (like v1.0.0), use it. Otherwise, default to "manual"
        VERSION="${{ github.ref_name }}"
        if [[ ! $VERSION =~ ^v[0-9] ]]; then
          VERSION="manual"
        fi
        mv dist/surveyscramblebot.exe dist/surveyscramblebot-$VERSION.exe

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/surveyscramblebot-*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
